# .github/workflows/deploy.yml – construit l'image et la pousse sur GHCR.
#
# `main` → étiquettes `main` et `<sha>` (production)
# `dev`  → étiquettes `dev`  et `<sha>` (préproduction, si on la garde)
#
# Le déploiement lui-même reste manuel au début (`./deploy.sh` sur le serveur).
# Pour l'automatiser plus tard : une étape SSH avec une clé dédiée, restreinte
# dans `authorized_keys` à la seule commande `deploy.sh`.
#
# Variables de dépôt à créer (Settings → Secrets and variables → Actions →
# Variables, pas Secrets : elles finissent dans le JavaScript public) :
#   NEXT_PUBLIC_RECAPTCHA_SITE_KEY, NEXT_PUBLIC_VAPID_PUBLIC_KEY,
#   NEXT_PUBLIC_SARUTOBI_PROJECT_TOKEN, NEXT_PUBLIC_SARUTOBI_HOST,
#   NEXT_PUBLIC_SARUTOBI_DEBUG, NEXT_PUBLIC_SARUTOBI_ENABLE_LOCAL
#
# Secret de dépôt (Secrets, cette fois) : DATABASE_URL, lu par `next build`.

name: Image Docker

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pedrokarim/dna-interactive:${{ github.ref_name }}
            ghcr.io/pedrokarim/dna-interactive:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SARUTOBI_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_SARUTOBI_PROJECT_TOKEN }}
            NEXT_PUBLIC_SARUTOBI_HOST=${{ vars.NEXT_PUBLIC_SARUTOBI_HOST }}
            NEXT_PUBLIC_SARUTOBI_DEBUG=${{ vars.NEXT_PUBLIC_SARUTOBI_DEBUG }}
            NEXT_PUBLIC_SARUTOBI_ENABLE_LOCAL=${{ vars.NEXT_PUBLIC_SARUTOBI_ENABLE_LOCAL }}
          # Lue par `next build`, montée en secret BuildKit, absente de l'image.
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
          # Cache des couches entre deux builds (dépendances surtout).
          cache-from: type=gha
          cache-to: type=gha,mode=max
